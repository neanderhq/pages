name: Project checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/check_repository.py
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  production:
    name: Runtime security
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: template
          POSTGRES_PASSWORD: template_ci_only
          POSTGRES_DB: template_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U template -d template_check"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: "postgresql://template:template_ci_only@127.0.0.1:5432/template_check"
      NEANDER_TEMPLATE_TEST_DATABASE_URL: "postgresql://template:template_ci_only@127.0.0.1:5432/template_check"
      NEANDER_TEMPLATE_IMAGE: "pages:security"
      NEANDER_TEMPLATE_TEST_ORIGIN: "http://127.0.0.1:8080"
      APP_URL: "http://127.0.0.1:8080"
      BETTER_AUTH_SECRET: "template-ci-only-pages-BETTER_AUTH_SECRET-32-characters"
      DEMO_PASSWORD: "template-ci-only-pages-DEMO_PASSWORD-32-characters"
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: "template"
      PGPASSWORD: "template_ci_only"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the production runtime
        run: docker build --pull -f .neander/Dockerfile -t "$NEANDER_TEMPLATE_IMAGE" .
      - name: Install checksum-verified Trivy
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
      - name: Scan the built runtime for vulnerabilities and secrets
        run: >-
          "$RUNNER_TEMP/trivy/trivy" image --image-src docker
          --scanners vuln,secret --exit-code 1 --format json
          --output "$RUNNER_TEMP/image-security.json" "$NEANDER_TEMPLATE_IMAGE"
      - run: python3 scripts/test_entrypoint.py
      - name: Migrate the disposable template database
        run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Verify PostgreSQL persistence with a DML-only app role
        run: |
          psql -v ON_ERROR_STOP=1 -d template_check -c 'CREATE DATABASE pages_publish_check;'
          DATABASE_URL=postgresql://template:template_ci_only@127.0.0.1:5432/pages_publish_check pnpm db:migrate
          psql -v ON_ERROR_STOP=1 -d pages_publish_check <<'SQL'
          CREATE ROLE pages_runtime LOGIN PASSWORD 'pages_runtime_ci_only';
          GRANT CONNECT ON DATABASE pages_publish_check TO pages_runtime;
          GRANT USAGE ON SCHEMA public TO pages_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO pages_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO pages_runtime;
          SQL
          PUBLISH_TEST_DATABASE_URL=postgresql://pages_runtime:pages_runtime_ci_only@127.0.0.1:5432/pages_publish_check node --test tests/publishing-postgres.test.ts
      - name: Install Chromium for real browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify native editor mentions and mobile tables
        env:
          PLAYWRIGHT_MODULE: playwright
        run: pnpm test:editor-browser
      - name: Verify native editor with Android touch emulation
        env:
          PLAYWRIGHT_MODULE: playwright
          PAGES_TEST_DEVICE: android
        run: pnpm test:editor-browser
      - name: Verify the built application and seeded data
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pages-image-browser
        run: pnpm test:production
      - name: Upload runtime security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-security
          path: ${{ runner.temp }}/image-security.json
          if-no-files-found: warn
          retention-days: 7
