  "schema_version": 2,
  "id": "notion",
  "version": "0.1.0",
  "name": "Notion-inspired document workspace framework",
  "status": "reference-pilot",
  "adapter": "react",
  "application_contract": {
    "required_layout_import": "NotionFramework"
  },
  "purpose": "A document workspace with nested pages, structured block editing, workspace workflows, nine database layouts, linked views and record peeks. Hosts own authorization, records, query/computed values, connected services and persistence.",
  "select_for": [
    "Document workspaces with nested pages and a block editor",
    "Knowledge bases with a Notion-inspired sidebar and page canvas"
  ],
  "avoid_for": [
    "Database-first table or kanban products",
    "Products preserving an established design system",
    "Issue trackers and appointment scheduling"
  ],
  "routing": {
    "primary_terms": [
      "notion-inspired workspace",
      "notion-style document editor",
      "block editor workspace",
      "research knowledge base"
    ],
    "workflow_terms": [
      "organize nested pages",
      "write documents",
      "edit knowledge pages",
      "knowledge base"
    ],
    "visual_terms": [
      "nested page sidebar",
      "wide page canvas",
      "quiet document toolbar",
      "slash command menu"
    ],
    "minimum_visual_matches": 2,
    "exclude_terms": [
      "existing design system",
      "issue tracker",
      "appointment scheduling",
      "crm"
    ]
  },
